style:
  MagicNumber:
    active: false
  MaxLineLength:
    active: true
    maxLineLength: 120
  ReturnCount:
    active: false
  NewLineAtEndOfFile:
    active: true

complexity:
  LongParameterList:
    active: false
  TooManyFunctions:
    active: true
    thresholdInFiles: 25
    thresholdInClasses: 20
    thresholdInInterfaces: 25
    thresholdInObjects: 20
  LongMethod:
    active: true
    threshold: 65
    ignoreAnnotated:
      - Test
  CyclomaticComplexMethod:
    threshold: 15

naming:
  FunctionNaming:
    ignoreAnnotated:
      - Composable
  TopLevelPropertyNaming:
    active: false

exceptions:
  TooGenericExceptionCaught:
    active: false
