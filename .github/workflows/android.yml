name: Android

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify release scripts
        shell: pwsh
        run: ./scripts/test/verify-release-scripts.ps1
      - name: Verify publish-safe vocabulary assets
        shell: pwsh
        run: ./scripts/test/verify-vocab-assets.ps1
      - name: Enable Gradle wrapper
        run: chmod +x ./gradlew
      - name: Dependency vulnerability scan
        if: ${{ env.NVD_API_KEY != '' }}
        run: ./gradlew --no-daemon --console=plain dependencyCheckAggregate
      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo chmod 666 /dev/kvm || true
          ls -l /dev/kvm || true
      - name: Free CI disk space
        run: |
          df -h
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
          df -h
      - name: Verify
        run: ./gradlew --no-daemon --console=plain ktlintCheck detekt testDebugUnitTest assembleDebug assembleDebugAndroidTest
      - name: Run API 30 instrumentation tests
        run: bash ./scripts/test/run-ci-emulator-tests.sh
      - name: Write release readiness evidence
        shell: pwsh
        run: ./scripts/test/write-github-actions-evidence.ps1
      - name: Upload release readiness evidence
        uses: actions/upload-artifact@v4
        with:
          name: github-actions-release-evidence
          if-no-files-found: error
          retention-days: 14
          path: build/release-readiness/github-actions-evidence.txt
      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-verification-reports
          if-no-files-found: warn
          retention-days: 14
          path: |
            **/build/reports/**
            **/build/test-results/**
            **/build/outputs/androidTest-results/**
